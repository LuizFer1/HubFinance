[package]
name = "hub_finance"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["qr_code"] }
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tower-http = { version = "0.7", features = ["cors", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "3"
sha2 = "0.11"
rand = "0.10"
hex = "0.4"
directories = "6"
local-ip-address = "0.6"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
futures = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Enquanto push e pull_request nao disparam neste repo (ROADMAP 0.0.2, item 1), e o unico
  # jeito de rodar os testes em Linux e macOS. Fica depois: rodar o CI de qualquer ref a mao.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cabecalhos de x11/wayland (iced, tiny-xlib, wayland-sys) e as bibliotecas que o GPUI
      # liga de verdade (fontconfig, freetype, xcb, vulkan). A lista do GPUI e ajustada pelo
      # primeiro CI verde.
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libx11-xcb-dev libxkbcommon-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev libxkbcommon-x11-dev libxcb1-dev libvulkan-dev

      - uses: Swatinem/rust-cache@v2

      - name: Formatacao
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Testes
        run: cargo test

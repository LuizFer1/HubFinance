name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Enquanto push e pull_request nao disparam neste repo (ROADMAP 0.0.2, item 1), e o unico
  # jeito de rodar os testes em Linux e macOS. Fica depois: rodar o CI de qualquer ref a mao.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # O iced abre X11, Wayland e Vulkan por dlopen, entao o build nao precisa deles; os
      # cabecalhos so calam o aviso do pkg-config do tiny-xlib e do wayland-sys.
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libx11-xcb-dev libxkbcommon-dev libwayland-dev

      - uses: Swatinem/rust-cache@v2

      - name: Formatacao
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Testes
        run: cargo test
